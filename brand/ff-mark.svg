<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 60" role="img" aria-label="Flux / Form">
  <!-- Flux / Form — two boxy F's joined by a slash set lighter than the strokes,
       mirroring the dropped ampersand in the wordmark. Single ink on paper. -->
  <g fill="#201e1a">
    <rect x="6" y="6" width="7" height="48"/>
    <rect x="6" y="6" width="32" height="7"/>
    <rect x="6" y="28" width="29" height="7"/>
    <rect x="72" y="6" width="7" height="48"/>
    <rect x="72" y="6" width="32" height="7"/>
    <rect x="72" y="28" width="29" height="7"/>
  </g>
  <path d="M48 54 L62 6" fill="none" stroke="#201e1a" stroke-width="4.2"/>
</svg>
